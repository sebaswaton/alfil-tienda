name: alfil-production-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-sebaswaton}/alfil-tienda-backend:${APP_VERSION:?Define APP_VERSION in .env.production}
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      ENABLE_API_DOCS: "false"
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env.production}
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN in .env.production}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:?Define MINIO_INTERNAL_ENDPOINT in .env.production}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Define MINIO_PUBLIC_ENDPOINT in .env.production}
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Define MINIO_APP_ACCESS_KEY in .env.production}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Define MINIO_APP_SECRET_KEY in .env.production}
      MINIO_BUCKET: ${MINIO_BUCKET:-alfil-catalog}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: "true"
      MEDIA_URL_EXPIRY_HOURS: ${MEDIA_URL_EXPIRY_HOURS:-4}
      MEDIA_ADMIN_API_KEY: ${MEDIA_ADMIN_API_KEY:?Define MEDIA_ADMIN_API_KEY in .env.production}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - application
    logging: *default-logging

  frontend:
    image: ghcr.io/${GHCR_OWNER:-sebaswaton}/alfil-tienda-frontend:${APP_VERSION:?Define APP_VERSION in .env.production}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    networks:
      - application
    logging: *default-logging

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    init: true
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Define CLOUDFLARE_TUNNEL_TOKEN in .env.production}
    depends_on:
      frontend:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - application
    logging: *default-logging

networks:
  application:
    driver: bridge
