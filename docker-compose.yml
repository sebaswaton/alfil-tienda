services:
  db:
    image: postgres:16-alpine
    container_name: alfil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alfil_tienda}
    ports:
      - "5432:5432"
    volumes:
      - alfil_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfil} -d ${POSTGRES_DB:-alfil_tienda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: alfil_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alfil_minio_data:/data

volumes:
  alfil_pg_data:
  alfil_minio_data:
